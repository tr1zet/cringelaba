name: Deploy GitHub Pages

on:
  push:
    branches: [main, codex/halloween-oracle]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout Halloween site
        uses: actions/checkout@v4
        with:
          ref: codex/halloween-oracle
          path: halloween-site

      - name: Build independent Pages paths
        shell: bash
        run: |
          mkdir -p public/halloween
          cp -R main-site/dist/. public/
          cp -R halloween-site/dist/. public/halloween/
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
